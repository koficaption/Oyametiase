# Local Supabase configuration for the Oyame Tiase Assembly system.
# Apply migrations with `supabase db push` after linking a project.

project_id = "oyame-tiase-assembly"

[api]
enabled = true

[db]
major_version = 15

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback"]

[realtime]
enabled = true

[storage]
enabled = true
